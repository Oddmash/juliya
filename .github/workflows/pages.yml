name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'site/**'
      - 'docs/guide/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/clean-dist.mjs'
      - 'tsconfig.json'
      - 'test/site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: /kowrap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$PAGES_BASE_PATH" != "$NEXT_PUBLIC_BASE_PATH" ]; then
            echo "GitHub Pages base path ($PAGES_BASE_PATH) differs from the configured Next.js base path ($NEXT_PUBLIC_BASE_PATH)."
            exit 1
          fi
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.32.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir site install --no-frozen-lockfile
      - run: pnpm test:site
      - run: pnpm --dir site exec playwright install --with-deps chromium
      - run: pnpm --dir site test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
