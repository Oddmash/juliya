name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must match package.json)
        required: true
        type: string
      publish:
        description: Publish to npm (unchecked runs verification only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release version
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --dir test/next-app install --no-frozen-lockfile
      - run: pnpm test:hydration
      - run: pnpm --dir test/next-app exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:package
      - name: Pack verified package
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          npm publish --dry-run --ignore-scripts "./release-artifacts/oddmash-kowrap-${RELEASE_VERSION}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: kowrap-npm-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: kowrap-npm-package
          path: release-artifacts
      - name: Publish verified tarball via OIDC
        run: npm publish "./release-artifacts/oddmash-kowrap-${RELEASE_VERSION}.tgz" --access public --ignore-scripts
