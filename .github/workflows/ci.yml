name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --dir test/next-app install --no-frozen-lockfile
      - run: pnpm test:hydration
      - run: pnpm --dir test/framework-app install --no-frozen-lockfile
      - run: pnpm test:frameworks
      - run: pnpm --dir test/next-app exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:package
      - run: pnpm --dir site install --no-frozen-lockfile
      - run: pnpm test:site
        env:
          NEXT_PUBLIC_BASE_PATH: /kowrap
